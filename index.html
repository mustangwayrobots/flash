<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mustang Way Robots | Firmware Portal</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
      max-width: 800px;
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--accent-blue);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 400;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-blue);
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.15);
    }

    .card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      letter-spacing: 1px;
    }

    .card-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
      flex-grow: 1;
    }

    .btn-flash {
      display: inline-block;
      text-align: center;
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      text-decoration: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-flash:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .status-msg {
      text-align: center;
      font-family: 'Orbitron', sans-serif;
      color: var(--text-muted);
      font-size: 1.2rem;
      margin-top: 4rem;
    }

    footer {
      margin-top: auto;
      padding-top: 4rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mustang Way Robots</h1>
    <p class="subtitle">Firmware Web Installer Portal</p>
  </header>

  <main class="container">
    <div id="repo-grid" class="grid"></div>
    <div id="status" class="status-msg">Scanning for robot project repositories...</div>
  </main>

  <footer>
    &copy; Mustang Way Robots • Automated Cloud Compilation System
  </footer>

  <script>
    const GITHUB_USERNAME = 'mustangwayrobots';

    // List of non-firmware utility repositories to ignore completely
    const ignoredRepos = [
      'flash',                       // Main portal hub
      'arduino-libraries',           // Central library collection
      'mustangwayrobots.github.io'   // Root organization page
    ];

    async function loadRobotRepositories() {
      const grid = document.getElementById('repo-grid');
      const status = document.getElementById('status');

      try {
        const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?per_page=100`);
        if (!response.ok) throw new Error('Failed to load project list');
        
        const repos = await response.json();

        // Filter out forks, archived repos, and explicitly ignored infrastructure repos
        const validProjects = repos.filter(repo => 
          !repo.fork && 
          !repo.archived && 
          !ignoredRepos.includes(repo.name)
        );

        if (validProjects.length === 0) {
          status.textContent = 'No robot project firmware available.';
          return;
        }

        status.style.display = 'none';
        grid.innerHTML = '';

        validProjects.forEach(repo => {
          const card = document.createElement('div');
          card.className = 'card';

          // Format clean display title (replaces underscores/dashes with spaces)
          const cleanTitle = repo.name.replace(/[-_]/g, ' ');

          card.innerHTML = `
            <div>
              <div class="card-title">${cleanTitle}</div>
              <div class="card-description">
                ${repo.description ? repo.description : 'ESP32 firmware build for Mustang Way Robots.'}
              </div>
            </div>
            <a href="https://${GITHUB_USERNAME}.github.io/${repo.name}/" class="btn-flash">
              Open Installer
            </a>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        status.textContent = 'Unable to load robot projects at this time.';
      }
    }

    loadRobotRepositories();
  </script>
</body>
</html>
