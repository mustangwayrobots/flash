<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Instant Automatic Redirect to Main Landing Page -->
  <meta http-equiv="refresh" content="0; url=https://mustangwayrobots.github.io/" />
  
  <title>Redirecting | Mustang Way Robots</title>
  
  <!-- Orbitron & Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050b14;
      --card-bg: #0c1524;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 60%),
        linear-gradient(to bottom, #050b14 0%, #030710 100%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .redirect-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--accent-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 1rem;
    }

    p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-decoration: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
    }
  </style>

  <script>
    // JavaScript backup redirect for immediate navigation
    window.location.href = "https://mustangwayrobots.github.io/";
  </script>
</head>
<body>

  <div class="redirect-card">
    <h1>Mustang Way Robots</h1>
    <p>Our portal has moved to a new centralized project dashboard!</p>
    <a href="https://mustangwayrobots.github.io/" class="btn">
      🚀 Go to Portal Home
    </a>
  </div>

</body>
</html>
