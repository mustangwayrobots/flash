<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustang Way Robots - Project Hub</title>
    
    <!-- Google Fonts: Orbitron -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* Global Orbitron Styling */
        * {
            font-family: 'Orbitron', sans-serif !important;
            font-style: normal !important;
        }

        body { 
            background-color: #050b14; 
            color: #ffffff; 
            padding: 40px 20px; 
            margin: 0; 
            text-align: center; 
        }

        h1 { 
            font-weight: 900;
            color: #38bdf8; 
            font-size: 28px;
            margin-bottom: 10px; 
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.6);
        }

        p { 
            color: #cbd5e1; 
            font-size: 14px; 
            font-weight: 500;
            margin-bottom: 40px; 
            letter-spacing: 0.5px;
        }
        
        .project-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .project-link { 
            text-decoration: none; 
            color: inherit; 
            display: block; 
        }
        
        .project-card { 
            background: #0f172a; 
            border: 2px solid #1e293b; 
            border-radius: 16px; 
            padding: 30px; 
            height: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4); 
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; 
            cursor: pointer;
            box-sizing: border-box; 
            text-align: left;
        }

        .project-card:hover { 
            transform: translateY(-5px); 
            border-color: #38bdf8; 
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.15);
        }

        .project-card h3 { 
            margin-top: 0; 
            color: #38bdf8; 
            font-size: 18px; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        .project-card p { 
            color: #94a3b8; 
            font-size: 13px; 
            line-height: 1.6; 
            margin: 0; 
            font-weight: 400;
        }
        
        #loading { 
            font-size: 14px; 
            color: #38bdf8; 
            font-weight: 700;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <h1>🤖 Mustang Way Robots</h1>
    <p>Select an automated project below to flash firmware directly over USB.</p>

    <div id="loading">SCANNING GITHUB ACCOUNT FOR ACTIVE PROJECTS...</div>
    <div class="project-grid" id="hub-grid"></div>

    <script>
        const username = "mustangwayrobots";
        const grid = document.getElementById('hub-grid');
        const loadingText = document.getElementById('loading');

        // Repositories we want to completely ignore from our dashboard display
        const ignoreList = ["flash", "mustangwayrobots.github.io"];

        async function fetchProjects() {
            try {
                // Fetch all public repos directly from the live GitHub API
                const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
                const repos = await response.json();
                
                loadingText.style.display = 'none'; // Clear the loading status message

                repos.forEach(repo => {
                    // Check if it's a hidden/admin repository
                    if (ignoreList.includes(repo.name)) return;

                    // Build clean display elements from GitHub's automated metrics
                    const cleanTitle = repo.name.replace(/[-]/g, ' ').replace(/[_]/g, ' ');
                    const description = repo.description || "No description provided. Click to access the installer layout terminal.";

                    const cardHTML = `
                        <a class="project-link" href="https://${username}.github.io/${repo.name}/">
                            <div class="project-card">
                                <h3>🤖 ${cleanTitle}</h3>
                                <p>${description}</p>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += cardHTML;
                });
            } catch (error) {
                loadingText.innerText = "ERROR PULLING PROJECTS AUTOMATICALLY FROM GITHUB.";
                console.error(error);
            }
        }

        // Fire off the API scanner immediately when page finishes mounting
        fetchProjects();
    </script>
</body>
</html>
