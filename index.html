<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustang Way Robots - Project Hub</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 40px; margin: 0; text-align: center; }
        h1 { color: #a855f7; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
        
        /* The Responsive Grid Container */
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Turn the cards into clickable button layouts */
        .project-link { text-decoration: none; color: inherit; display: block; }
        
        .project-card { 
            background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s, border-color 0.2s; cursor: pointer;
        }
        /* Make it visually obvious it can be clicked */
        .project-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        
        .project-card h3 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
        .project-card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>

    <h1>🤖 Mustang Way Robots - Project Hub</h1>
    <p>Select a project below to open its direct web-installer terminal.</p>

    <!-- This empty grid fills itself automatically using the script below! -->
    <div class="project-grid" id="hub-grid"></div>

    <script>
        // 🛠️ TEACHER CONFIGURATION MASTER LIST
        // Whenever you launch a new project repository, simply add it to this array:
        const myProjects = [
            {
                repoName: "ESP_NOW_CAR",
                title: "🚗 ESP_NOW_CAR",
                desc: "Firmware for our custom-built RC cars utilizing high-speed ESP-NOW communication protocol."
            },
            {
                repoName: "flash", // Points back to this main tool if needed
                title: "⚡ Flash Core Firmware",
                desc: "The standard baseline testing firmware for DGS Mustang Robotics Club boards."
            }
        ];

        // This loops through your list above and builds the HTML layout dynamically
        const grid = document.getElementById('hub-grid');
        myProjects.forEach(project => {
            const cardHTML = `
                <a class="project-link" href="https://github.io{project.repoName}/">
                    <div class="project-card">
                        <h3>${project.title}</h3>
                        <p>${project.desc}</p>
                    </div>
                </a>
            `;
            grid.innerHTML += cardHTML;
        });
    </script>
</body>
</html>
