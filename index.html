<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mustang Way Robots - Live Hub</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #fff; padding: 40px; margin: 0; text-align: center; }
        h1 { color: #a855f7; margin-bottom: 5px; }
        p { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
        
        .project-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        .project-link { text-decoration: none; color: inherit; display: block; }
        
        .project-card { 
            background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; height: 100%;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.2s, border-color 0.2s; cursor: pointer;
            box-sizing: border-box; text-align: left;
        }
        .project-card:hover { transform: translateY(-5px); border-color: #38bdf8; }
        .project-card h3 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; text-transform: uppercase; }
        .project-card p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; margin: 0; }
        
        #loading { font-size: 1.2rem; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>🤖 Mustang Way Robots - Project Hub</h1>
    <p>Select an automated project below to flash firmware over USB.</p>

    <div id="loading">Scanning GitHub account for active projects...</div>
    <div class="project-grid" id="hub-grid"></div>

    <script>
        const username = "mustangwayrobots";
        const grid = document.getElementById('hub-grid');
        const loadingText = document.getElementById('loading');

        // Repositories we want to completely ignore from our dashboard display
        const ignoreList = ["flash", "mustangwayrobots.github.io"];

        async function fetchProjects() {
            try {
                // Fetch all public repos directly from the live GitHub API
                const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100`);
                const repos = await response.json();
                
                loadingText.style.display = 'none'; // Clear the loading status message

                repos.forEach(repo => {
                    // Check if it's a hidden/admin repository
                    if (ignoreList.includes(repo.name)) return;

                    // Build clean display elements from GitHub's automated metrics
                    const cleanTitle = repo.name.replace(/-/g, ' ').replace(/_/g, ' ');
                    const description = repo.description || "No description provided. Click to access the installer layout terminal.";

                    const cardHTML = `
                        <a class="project-link" href="https://${username}.github.io/${repo.name}/">
                            <div class="project-card">
                                <h3>🤖 ${cleanTitle}</h3>
                                <p>${description}</p>
                            </div>
                        </a>
                    `;
                    grid.innerHTML += cardHTML;
                });
            } catch (error) {
                loadingText.innerText = "Error pulling projects automatically from GitHub.";
                console.error(error);
            }
        }

        // Fire off the API scanner immediately when page finishes mounting
        fetchProjects();
    </script>
</body>
</html>
